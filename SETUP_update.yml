# 이 파일은 복사용입니다. GitHub 웹에서 Add file → Create new file → 파일명에 '.github/workflows/update.yml' 입력 → 아래 내용 붙여넣기 → Commit
name: update-data
on:
  schedule:
    - cron: "*/5 1-10 * * 1-5"    # 08:00~17:59 WIB (UTC+7) 평일 5분마다 — GitHub 사정으로 5~15분 지연될 수 있음
    - cron: "0 12,23 * * *"        # 장 마감 후 확정치 · 다음날 새벽 캘린더 갱신
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: update, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: fetch
        run: python fetch_data.py
        env:
          TZ: Asia/Jakarta
          IDX_PROXY: ${{ vars.IDX_PROXY }}      # (선택) Settings → Variables 에 Worker 주소를 넣으면 IDX 호출을 Worker 로 우회
      - name: commit data.json
        run: |
          git config user.name idx-live-bot && git config user.email bot@users.noreply.github.com
          git add data.json data/cache/*.json || true
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.d.outputs.page_url }} }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
