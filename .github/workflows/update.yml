name: update-and-deploy
# GitHub 서버(Actions)가 장중 5분마다 수집해 data.json 을 갱신하고 Pages 로 배포한다.
# → 사장님 PC 가 꺼져 있어도 사이트는 계속 갱신된다.
# PC 쪽 auto_push 는 기본적으로 번역 캐시(tr_claude.json)·수기값(manual.json)만 올린다 (data.json 은 러너가 단일 작성자).
on:
  schedule:
    - cron: "*/5 1-10 * * 1-5"    # 08:00~17:59 WIB 평일, 5분마다 (GitHub 사정으로 5~15분 지연 가능)
    - cron: "*/15 11-16 * * 1-5"  # 18:00~23:59 WIB 평일, 15분마다 — 美 지표 실제치(19:30~21:30 WIB)·저녁 뉴스
    - cron: "0 17-23,0 * * *"     # 00:00~07:59 WIB 매일 1시간마다 — 새벽 캘린더·해외 뉴스
    - cron: "0 1-16/2 * * 0,6"    # 주말 08:00~23:00 WIB 2시간마다
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  fetch:
    # 스케줄 · 수동 · PC 가 idx_part.json 을 올린 push([skip ci] 없음) 모두 수집. 러너 자신의 커밋은 [skip ci] 라 재실행되지 않는다
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'idx_part')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: fetch
        run: python fetch_data.py
        env:
          TZ: Asia/Jakarta
          IDX_PROXY: ${{ vars.IDX_PROXY }}      # (선택) 러너 IP 가 IDX 에 막히면 Cloudflare Worker 주소를 Variables 에 등록
          # (선택) 등록하면 PC 가 꺼진 주말에도 러너가 지수·공시 AI 요약을 만든다. 종목 요약은 호출량이 커서 PC 전용.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: chat context
        run: python make_chat_context.py
        env: { TZ: Asia/Jakarta }
      - name: commit data
        # 러너의 산출물(data.json·data.js·구글 번역 캐시)만 올린다. PC 가 그 사이 올린 파일과 충돌하지 않도록
        # 최신 main 위에 산출물을 다시 얹어 커밋한다 (rebase 충돌로 data.json 이 안 올라가는 일 방지)
        run: |
          git config user.name idx-live-bot && git config user.email bot@users.noreply.github.com
          mkdir -p /tmp/out && for f in data.json data.js data/cache/tr_ko.json data/cache/news_seen.json; do [ -e "$f" ] && cp "$f" /tmp/out/$(basename "$f"); done; true
          git fetch origin main && git reset --hard origin/main
          [ -e /tmp/out/data.json ] && cp /tmp/out/data.json data.json; [ -e /tmp/out/data.js ] && cp /tmp/out/data.js data.js
          [ -e /tmp/out/tr_ko.json ] && cp /tmp/out/tr_ko.json data/cache/tr_ko.json; [ -e /tmp/out/news_seen.json ] && cp /tmp/out/news_seen.json data/cache/news_seen.json; true
          git add -A -- data.json data.js data/cache/tr_ko.json data/cache/news_seen.json 2>/dev/null; true
          git commit -m "data $(TZ=Asia/Jakarta date +%Y-%m-%d\ %H:%M) WIB [skip ci]" || echo "no change"
          for i in 1 2 3; do git push && break; git fetch origin main && git rebase origin/main || git rebase --abort; sleep 5; done; true
  deploy:
    needs: fetch
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
